name: PC Virtual

on:
  workflow_dispatch:

jobs:
  pc-virtual:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - name: Atualizar sistema
        run: |
          sudo apt-get update
          sudo apt-get upgrade -y

      - name: Instalar interface gráfica
        run: |
          sudo apt-get install -y xfce4 xfce4-goodies
          sudo apt-get install -y xrdp

      - name: Configurar XRDP
        run: |
          echo "startxfce4" > ~/.xsession
          sudo systemctl enable xrdp
          sudo systemctl restart xrdp

      - name: Criar senha do usuário
        run: |
          echo "runner:PCVirtual123" | sudo chpasswd

      - name: Instalar ngrok
        run: |
          curl -s https://ngrok-agent.s3.amazonaws.com/ngrok.asc \
            | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
          echo "deb https://ngrok-agent.s3.amazonaws.com buster main" \
            | sudo tee /etc/apt/sources.list.d/ngrok.list
          sudo apt-get update
          sudo apt-get install -y ngrok

      - name: Configurar ngrok
        env:
          NGROK_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        run: |
          ngrok config add-authtoken "$NGROK_TOKEN"

      - name: Iniciar conexão
        run: |
          ngrok tcp 3389 --log=stdout > ngrok.log 2>&1 &
          sleep 5
          cat ngrok.log

      - name: Manter o PC funcionando
        run: |
          echo "PC virtual iniciado!"
          echo "Usuário: runner"
          echo "Senha: PCVirtual123"
          sleep 18000
